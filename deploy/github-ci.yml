# Continuous integration. To enable: move this file to .github/workflows/ci.yml
# (pushing workflow files requires a token with the `workflow` scope).
name: ci
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: DATABASE_URL=postgresql://x npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx tsc --noEmit -p apps/api
      - run: npm test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p apps/web
      - run: npm run build -w @nuvio/web
